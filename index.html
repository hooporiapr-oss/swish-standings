<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SWISH BASKETBALL — STANDINGS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;color:#fff;background:#000;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#space{position:fixed;inset:0;background:#000;overflow:hidden}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
#edge-glow{position:fixed;inset:0;pointer-events:none;z-index:1;display:none}
#flash{position:fixed;inset:0;pointer-events:none;z-index:10;opacity:0;transition:opacity .1s}
#flash.buzzer{transition:opacity .35s ease-out}
body.buzzer-shake{animation:buzzerShake .5s cubic-bezier(.36,.07,.19,.97) 2}
@keyframes buzzerShake{
  0%,100%{transform:translate(0,0)}
  10%{transform:translate(-6px,-4px)}
  20%{transform:translate(7px,3px)}
  30%{transform:translate(-8px,4px)}
  40%{transform:translate(6px,-3px)}
  50%{transform:translate(-5px,3px)}
  60%{transform:translate(5px,-4px)}
  70%{transform:translate(-4px,2px)}
  80%{transform:translate(4px,-2px)}
  90%{transform:translate(-2px,1px)}
}

#hud{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-around;align-items:center;padding:22px 22px 10px;background:linear-gradient(180deg,rgba(0,0,0,.9),transparent)}
.hud-box{text-align:center}
.hud-label{font-size:.5rem;color:#7c3aed;font-weight:900;letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px}
.hud-val{font-size:2rem;font-weight:900;line-height:1}
#hScore{color:#fff;font-size:2.6rem}#hRound{color:#ffd35a}#hBest{font-size:1.3rem;color:#9fb3c8}

#msg{display:none !important}
#msg.watch{color:#7c3aed}#msg.go{color:#ffd35a}#msg.correct{color:#00D9A5}#msg.wrong{color:#FF1493}

.ripple{position:fixed;border-radius:50%;border:3px solid #7c3aed;transform:translate(-50%,-50%) scale(0);pointer-events:none;z-index:14;animation:rippleOut .5s ease-out forwards}
@keyframes rippleOut{0%{transform:translate(-50%,-50%) scale(.5);opacity:1}100%{transform:translate(-50%,-50%) scale(2.4);opacity:0}}
.tap-particle{position:absolute;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:50}
@keyframes particleBurst{0%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}}
@keyframes confettiFall{0%{transform:translateY(-100px) rotate(0deg) scale(1);opacity:1}100%{transform:translateY(100vh) rotate(720deg) scale(0.5);opacity:0}}
@keyframes courtBorderGlow{
  0%,100%{
    border-color:rgba(200,220,230,.28);
    box-shadow:0 0 60px rgba(200,220,230,.18),inset 0 0 40px rgba(200,220,230,.06),0 20px 60px rgba(0,0,0,.8);
  }
  50%{
    border-color:rgba(210,230,240,.65);
    box-shadow:0 0 90px rgba(200,220,230,.4),inset 0 0 55px rgba(200,220,230,.16),0 20px 60px rgba(0,0,0,.8);
  }
}

.court{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;
  display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(5,1fr);
  gap:8px;width:min(92vw,119vh);height:min(65.7vw,85vh);
  border:2px solid rgba(200,220,230,.28);border-radius:14px;padding:8px;
  animation:courtBorderGlow 2.8s ease-in-out infinite;
  background-color:rgba(190,215,225,.05);
}
.court-rim-net{position:absolute;inset:0;pointer-events:none;z-index:1;width:100%;height:100%}
.cell-filler{border-radius:6px;background:rgba(190,215,225,.04);border:1.5px solid rgba(200,220,230,.14)}
.choice-btn{border:3px solid rgba(200,220,230,.3);background:transparent;border-radius:50%;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .08s;padding:0;width:100%;height:100%;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(circle at 35% 32%,#3a2a1a,#241606 85%);
}
.choice-btn.lit{
  border-color:rgba(255,140,0,.9);
  background:
    url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Cdefs%3E%3CclipPath%20id%3D%22c%22%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2249%22/%3E%3C/clipPath%3E%3C/defs%3E%3Cg%20clip-path%3D%22url%28%23c%29%22%20fill%3D%22none%22%20stroke%3D%22%23231005%22%20stroke-width%3D%223.4%22%3E%3Cline%20x1%3D%2250%22%20y1%3D%22-4%22%20x2%3D%2250%22%20y2%3D%22104%22/%3E%3Cpath%20d%3D%22M%20-4%2050%20Q%2050%20-4%20104%2050%22/%3E%3Cpath%20d%3D%22M%20-4%2050%20Q%2050%20104%20104%2050%22/%3E%3Cellipse%20cx%3D%2250%22%20cy%3D%2250%22%20rx%3D%2224%22%20ry%3D%2249%22/%3E%3C/g%3E%3C/svg%3E'),
    radial-gradient(circle at 35% 32%,#ffb35c,#ff8c00 55%,#d9660a 85%);
  background-size:100% 100%,100% 100%;
  box-shadow:0 0 40px rgba(255,140,0,.85),0 0 60px rgba(255,140,0,.45);
}
.choice-btn:active{transform:scale(.94)}


#screen-intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#140800 0%,#000 70%);z-index:50;overflow-y:auto;overflow-x:hidden;padding:20px 16px 24px;box-sizing:border-box;text-align:center}
.vrr-sub{font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:#7c3aed;margin-bottom:28px}
.rule-t{font-size:.9rem;color:#cbd5e1;line-height:1.5;max-width:440px;margin-bottom:26px}
.name-input{width:100%;max-width:420px;padding:14px;border-radius:14px;border:2px solid rgba(255,107,53,.4);background:rgba(255,255,255,.05);color:#fff;font-family:Arial,sans-serif;font-size:1rem;text-align:center}
.name-input:focus{outline:none;border-color:#FF6B35;box-shadow:0 0 24px rgba(255,107,53,.35)}
.standings-row{font-size:.8rem;color:#9fb3c8;padding:10px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:12px;cursor:pointer}
.standings-row:last-child{border-bottom:none}
.standings-row:active{background:rgba(124,58,237,.08)}
.standings-rank{font-weight:900;font-size:1.05rem;color:#7c3aed;min-width:28px}
.standings-row.rank-1 .standings-rank{color:#ffd35a}
.standings-row.rank-2 .standings-rank{color:#c4b5fd}
.standings-row.rank-3 .standings-rank{color:#fb923c}
.standings-name{flex:1;color:#fff;font-weight:700;text-align:left}
.standings-pts{color:#00e5ff;font-weight:900;font-size:1rem}
.standings-bpm{color:#9fb3c8;font-size:.72rem;min-width:64px;text-align:right}
.rule-t b{color:#fff}
.big-btn{width:100%;max-width:420px;height:68px;border:none;border-radius:20px;background:linear-gradient(135deg,#FF6B35,#ff8a5c);color:#fff;font-size:1.2rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 40px rgba(255,107,53,.7);margin-bottom:14px}
.intro-back{position:fixed;top:16px;left:16px;padding:8px 16px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.5);color:#fff;font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;text-decoration:none;z-index:60}
.best-line{margin-top:18px;font-size:.85rem;color:#9fb3c8}
.best-line b{color:#7c3aed}

#screen-end{position:fixed;inset:0;z-index:55;display:none;flex-direction:column;align-items:center;justify-content:center;background:#000;text-align:center;padding:20px}

#screen-box{display:none;position:fixed;inset:0;z-index:200;flex-direction:column;align-items:center;background:radial-gradient(ellipse at center,#140800 0%,#000 70%);padding:20px 16px 24px;overflow-y:auto}
.box-title{font-size:1.7rem;font-weight:900;font-style:italic;letter-spacing:.06em;text-transform:uppercase;color:#fff;text-shadow:0 0 40px rgba(255,140,0,.8);margin-bottom:2px}
.box-title span{color:#00e5ff}
.box-sub{font-size:.65rem;letter-spacing:.24em;text-transform:uppercase;color:#7c3aed;margin-bottom:22px}
.box-grid{width:100%;max-width:1000px;display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.box-section{width:100%;margin-bottom:24px}
.box-section-label{font-size:.65rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:#ffd35a;margin-bottom:8px;text-align:left;padding-left:4px}
.box-table{width:100%;border-collapse:collapse;background:rgba(124,58,237,.06);border:1px solid rgba(124,58,237,.3);border-radius:12px;overflow:hidden}
.box-table th{background:rgba(124,58,237,.18);color:#a78bfa;font-size:.6rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:8px 6px;text-align:center;border-bottom:1px solid rgba(124,58,237,.3)}
.box-table td{padding:12px 6px;text-align:center;font-weight:900;font-size:1.1rem;color:#fff}
.box-table .box-pts{color:#00e5ff;font-size:1.4rem}
.box-empty{color:#7fa8c0;font-size:.85rem;padding:24px 8px;font-style:italic}
.box-back-btn{align-self:flex-start;padding:8px 16px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.5);color:#fff;font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;cursor:pointer;margin-bottom:20px}
.box-recent-row{font-size:.75rem;color:#9fb3c8;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;padding:8px 10px;cursor:pointer}
.box-recent-row:hover{background:rgba(124,58,237,.08)}
.box-recent-row .expand-hint{color:#7c3aed;font-size:.65rem;text-transform:uppercase;letter-spacing:.06em;margin-left:8px}
.tap-log{display:flex;flex-wrap:wrap;gap:4px;padding:10px;background:rgba(124,58,237,.05);border:1px solid rgba(124,58,237,.25);border-radius:12px;margin-top:8px}
.tap-chip{flex:0 0 auto;min-width:44px;padding:4px 6px;border-radius:7px;text-align:center;font-family:Arial,Helvetica,sans-serif;font-size:.62rem;font-weight:900;line-height:1.3}
.tap-chip.hit{background:rgba(124,58,237,.22);border:1px solid rgba(124,58,237,.5);color:#c4b5fd}
.tap-chip.miss{background:rgba(255,20,147,.16);border:1px solid rgba(255,20,147,.4);color:#ff8fb8}
.tap-chip .tap-bpm{display:block;font-size:.68rem}
.tap-chip .tap-pts{display:block;opacity:.85;font-size:.58rem;margin-top:1px}
.tap-log-total{width:100%;text-align:center;margin-top:0;padding:8px 14px 14px;border-top:1px solid rgba(124,58,237,.25);font-size:.85rem;font-weight:900;color:#fff}
.tap-log-total b{color:#00e5ff;font-size:1.1rem}
.tap-log-empty{color:#7fa8c0;font-size:.75rem;font-style:italic;padding:8px}
.box-recent-row:last-child{border-bottom:none}
.box-recent-row b{color:#ffd35a}
.box-open-btn{width:100%;max-width:420px;height:52px;border:2px solid rgba(0,229,255,.5);background:rgba(0,229,255,.1);border-radius:14px;color:#00e5ff;font-size:.9rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;margin-top:6px}

.final-num{font-size:6rem;font-weight:900;color:#7c3aed;line-height:1;text-shadow:0 0 60px rgba(124,58,237,.9)}
.final-label{font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:#9fb3c8;margin-top:10px}
.final-bpm-big{font-size:1.8rem;font-weight:900;color:#ffd35a;margin-top:10px}
.final-acc{margin-top:6px;font-size:1.1rem;color:#ffd35a;font-weight:900}
.final-misses{margin-top:10px;font-size:1.3rem;font-weight:900;color:#FF1493;text-shadow:0 0 20px rgba(255,20,147,.5)}
.final-misses.clean{color:#00D9A5;text-shadow:0 0 20px rgba(0,217,165,.5)}
#screen-end h2{font-size:1.8rem;font-weight:900;margin:24px 0 8px}
#endSub{font-size:.9rem;color:#9fb3c8;line-height:1.6;max-width:400px}
.next-player-btn{margin-top:28px;height:64px;padding:0 40px;border:none;border-radius:16px;background:linear-gradient(120deg,#7c3aed,#5b21b6);color:#fff;font-size:1.15rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 30px rgba(124,58,237,.6)}
.session-line{margin-top:22px;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:#7fa8c0}

#countdown{position:fixed;inset:0;z-index:56;display:none;align-items:center;justify-content:center;background:#000}
#bigCount{font-size:8rem;font-weight:900;color:#7c3aed;text-shadow:0 0 60px rgba(124,58,237,.9)}
@media(max-width:420px){#screen-intro{padding:16px 12px 20px}.big-btn{height:56px;font-size:1rem;margin-bottom:10px}
  #choices{grid-template-columns:70px 70px 70px;grid-template-rows:62px 62px 62px;gap:6px}
  .choice-btn .arrow-glyph{font-size:1.5rem}
}
</style>

</head>
<body>

<div id="screen-box" style="display:flex">
  <button class="box-back-btn" id="refreshBtn" type="button">🔄 Refresh</button>
  <div class="box-title">THE <span>STANDINGS</span></div>
  <div class="box-sub">Swish Basketball · Player vs. Player</div>

  <div style="width:100%;max-width:600px">
    <div class="box-section">
      <div class="box-section-label">Standings — Best Score Per Player</div>
      <div class="box-table" id="standingsList" style="border-radius:12px"></div>
      <div class="tap-log" id="standingsTapLog" style="display:none"></div>
    </div>
  </div>
</div>

<script>
function $(id){return document.getElementById(id)}

var SB_URL='https://sdaphocueugzfvjovuxd.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkYXBob2N1ZXVnemZ2am92dXhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MjQyMDgsImV4cCI6MjA5OTIwMDIwOH0.pDAzf4P6dD9eNEBlnP95SdF5BI-R84-Rdc0vKzYcn7M';
var SB_TABLE='vr_swish_basketball_standings';

function fetchStandings(){
  var url=SB_URL+'/rest/v1/'+SB_TABLE+'?select=player_name,score,made,attempts,avg_ms,shots&order=score.desc';
  return fetch(url,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}})
    .then(function(r){if(!r.ok)throw new Error('bad response');return r.json()})
    .then(function(rows){
      var best={};
      (rows||[]).forEach(function(r){
        var existing=best[r.player_name];
        if(!existing||r.score>existing.pts){
          best[r.player_name]={name:r.player_name,pts:r.score,made:r.made,attempts:r.attempts,ms:r.avg_ms,shots:r.shots||[]};
        }
      });
      return Object.keys(best).map(function(n){return best[n]}).sort(function(a,b){return b.pts-a.pts});
    });
}

function renderTapLog(container,shots,finalScore){
  if(!shots||!shots.length){
    container.innerHTML='<div class="tap-log-empty">No round-by-round detail saved for this game.</div>';
    return;
  }
  var chips=shots.map(function(s){
    if(s.hit){
      return '<div class="tap-chip hit"><span class="tap-bpm">ROUND '+s.round+'</span><span class="tap-pts">+'+s.pts+'</span></div>';
    }
    return '<div class="tap-chip miss"><span class="tap-bpm">ROUND '+s.round+'</span><span class="tap-pts">MISS</span></div>';
  }).join('');
  container.innerHTML=chips+'<div class="tap-log-total">Final Score: <b>'+finalScore+' PTS</b></div>';
}

function renderStandings(){
  var listEl=$('standingsList');
  var tapLogEl=$('standingsTapLog');
  tapLogEl.style.display='none';
  listEl.innerHTML='<div class="box-empty">Loading standings…</div>';

  fetchStandings().then(function(ranked){
    var openRowName=null;
    if(!ranked.length){
      listEl.innerHTML='<div class="box-empty">No players yet — be the first name on the board.</div>';
      return;
    }
    listEl.innerHTML=ranked.map(function(p,i){
      var rankClass=i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'';
      var safeName=p.name.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      return '<div class="standings-row '+rankClass+'" data-name="'+safeName+'">'
        +'<span class="standings-rank">'+(i+1)+'</span>'
        +'<span class="standings-name">'+safeName+'</span>'
        +'<span class="standings-bpm">'+(p.made>0?p.made+' rounds':'')+'</span>'
        +'<span class="standings-pts">'+p.pts+'</span>'
        +'</div>';
    }).join('');
    listEl.querySelectorAll('.standings-row').forEach(function(row){
      row.addEventListener('click',function(){
        var name=row.dataset.name;
        if(openRowName===name){
          tapLogEl.style.display='none';
          openRowName=null;
          return;
        }
        openRowName=name;
        var p=ranked.find(function(r){return r.name===name});
        renderTapLog(tapLogEl,p.shots,p.pts);
        tapLogEl.style.display='flex';
        row.insertAdjacentElement('afterend',tapLogEl);
      });
    });
  }).catch(function(){
    listEl.innerHTML='<div class="box-empty">Couldn\'t load standings right now — try again in a moment.</div>';
  });
}

renderStandings();
document.getElementById('refreshBtn').addEventListener('click', renderStandings);
// A display board left running for a whole class period or a full
// day shouldn't need someone standing there clicking Refresh to keep
// it current. This keeps the board honest on its own.
setInterval(renderStandings, 30000);
</script>

</body>
</html>
